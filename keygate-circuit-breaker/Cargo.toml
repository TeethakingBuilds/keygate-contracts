[package]
name = "keygate-circuit-breaker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rolling-window spend limits with automatic tripping, for guarding keygate-authorized actions."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Only the tests compose a real registry in front of a real breaker; the
# breaker itself knows nothing about keygate-core.
keygate-core = { path = "../keygate-core" }
