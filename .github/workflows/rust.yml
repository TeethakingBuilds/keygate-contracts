name: Rust

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite on a ref without pushing a commit, which
  # is the only way to check a branch that CI has not seen yet.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain this repository pins
        # `rust-toolchain.toml` asks for stable plus rustfmt, clippy and the wasm
        # target; the runner image does not guarantee the extras are present.
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  optimize:
    name: Release wasm
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: make optimize

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: keygate-wasm-${{ github.sha }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 30
