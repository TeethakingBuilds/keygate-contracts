name: Clippy report

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain this repository pins
        run: rustup component add clippy

      - name: Collect every finding
        # Deliberately without `-D warnings`: warnings must not abort the run, so
        # every crate in the workspace gets linted and reported in one pass.
        run: |
          cargo clippy --locked --workspace --all-targets \
            --message-format=short 2>&1 | tee clippy.txt
          {
            echo '## Clippy report'
            echo
            echo '```'
            grep -E ':[0-9]+:[0-9]+: (warning|error)' clippy.txt | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the tests too
        # Reported, not gated: this workflow exists to show everything that is
        # currently wrong in one pass.
        continue-on-error: true
        run: cargo test --locked --workspace
