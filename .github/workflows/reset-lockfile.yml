name: Reset lockfile

# Why this exists: `soroban-sdk 22.0.11` pins `soroban-env-host =22.1.3`, and
# that crate declares `ed25519-dalek >=2.0.0` with no upper bound. A fresh
# resolve therefore pulls dalek 3.x into env-host, whose testutils then fails to
# compile: it passes a `rand_chacha 0.3` RNG (rand_core 0.6) into an interface
# typed against dalek 3's rand_core 0.9. Pinning dalek to 2.1.1 in a committed
# `Cargo.lock` is the fix, and `--locked` in `rust.yml` is what keeps a later
# `cargo update` from silently un-pinning it.
#
# Run this by hand after changing a dependency version. It re-resolves, reapplies
# the pin, proves the workspace actually compiles with the result, and only then
# commits the lockfile.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reset-lockfile-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lock:
    name: Resolve, verify, commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve a fresh lockfile
        run: cargo generate-lockfile

      - name: Pin ed25519-dalek below 3.0
        run: |
          current=$(awk '/^name = "ed25519-dalek"$/{getline; gsub(/"/, ""); print; exit}' Cargo.lock)
          echo "resolved ed25519-dalek: ${current:-absent}"
          case "$current" in
            2.*) echo "already below 3.0; nothing to pin." ;;
            3.*) cargo update -p "ed25519-dalek@$current" --precise 2.1.1 ;;
            "")  echo "ed25519-dalek is not in the graph." ;;
            *)   echo "Unexpected dalek version: $current" >&2; exit 1 ;;
          esac
          grep -A1 '^name = "ed25519-dalek"$' Cargo.lock

      - name: Verify the workspace compiles against this lockfile
        # `--all-targets` so the test-only feature paths are covered too; that
        # is where the dalek/rand_core mismatch showed up in the first place.
        run: cargo build --locked --workspace --all-targets

      - name: Commit
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Lockfile unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: reset the dependency lockfile with ed25519-dalek pinned below 3.0"
          git push origin HEAD:${{ github.ref_name }}
