[package]
name = "keygate-payments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Policy-guarded USDC payments for keygate: spending limits, recipient allowlists and co-signed approvals over the official USDC Stellar Asset Contract."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
