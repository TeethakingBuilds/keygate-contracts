[workspace]
members = [
    "keygate-core",
    "keygate-policy",
    "keygate-circuit-breaker",
    "keygate-multisig",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TeethakingBuilds/keygate-contracts"
publish = false

[workspace.dependencies]
soroban-sdk = "22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
